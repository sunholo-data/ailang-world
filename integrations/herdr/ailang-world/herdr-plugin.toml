id = "ailang-world"
name = "AILANG World"
version = "0.1.0"
min_herdr_version = "0.9.3"
platforms = ["macos", "linux"]

[[actions]]
id = "world-agent"
title = "New World agent"
contexts = ["workspace", "pane"]
command = ["bin/world-open", "world-agent-popup"]

[[actions]]
id = "plain-agent"
title = "New plain agent"
contexts = ["workspace", "pane"]
command = ["bin/world-open", "plain-agent-popup"]

[[actions]]
id = "world-config"
title = "World: write config"
contexts = ["workspace", "pane"]
command = ["bin/world-config-init"]

[[actions]]
id = "world-keys"
title = "World: install key bindings"
description = "Shows the key bindings, then adds them to herdr's config only after you type y"
contexts = ["workspace", "pane"]
command = ["bin/world-open", "world-keys-popup"]

[[actions]]
id = "world-panel"
title = "World panel"
contexts = ["workspace", "pane"]
command = ["bin/world-open-panel"]

[[panes]]
id = "world-keys-popup"
title = "World key bindings"
placement = "popup"
command = ["bin/world-keys"]

[[panes]]
id = "world-panel"
title = "World"
placement = "overlay"
command = ["bin/world-panel"]

[[panes]]
id = "world-agent-popup"
title = "New World agent"
placement = "popup"
command = ["bin/world-agent-popup"]

[[panes]]
id = "plain-agent-popup"
title = "New plain agent"
placement = "popup"
command = ["bin/plain-agent-popup"]

[[events]]
id = "pane-closed"
on = "pane.closed"
command = ["bin/world-event", "pane.closed"]

[[events]]
id = "pane-exited"
on = "pane.exited"
command = ["bin/world-event", "pane.exited"]

[[startup]]
command = ["bin/world-watch"]
