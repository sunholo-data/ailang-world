<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AILANG World — Repos, Presets &amp; Exec Profiles</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --ok: #3fb950; --warn: #d29922; --err: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .nav { display: flex; gap: 12px; align-items: center; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  main { max-width: 1120px; margin: 0 auto; padding: 20px; display: grid; gap: 24px; }
  section h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); background: #0d1117; }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .pill.err { border-color: var(--err); color: var(--err); }
  .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; overflow-x: auto; white-space: nowrap; }
  .status { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AILANG World · Repos, Presets &amp; Exec Profiles</h1>
  <div class="nav">
    <span id="status" class="status">Loading…</span>
    <button id="refresh" type="button">Refresh</button>
    <a href="/surface">← Surface</a>
  </div>
</header>
<main>
  <section>
    <h2>Launch Presets</h2>
    <div id="presets" class="grid"></div>
  </section>
  <section>
    <h2>Exec Profiles</h2>
    <div id="profiles" class="grid"></div>
  </section>
</main>
<script src="/surface/repos.js"></script>
</body>
</html>
