<!doctype html>
<html lang="en" data-app>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World</title>
<link rel="stylesheet" href="/surface/app.css">
</head>
<body>
<div id="root" tabindex="0" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown + - End Home Enter Escape / ? ,">
  <header class="hdr">
    <a class="brand" id="home" href="/surface" aria-label="World: back to the timeline">
      <span class="logo-tile"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32" role="img" aria-label="AILANG"><title>AILANG</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e73c17"/>
      <stop offset="100%" stop-color="#c08015"/>
    </linearGradient>
  </defs>

  <!-- Outer regular hexagon (flat-top, centered at 256,256, radius 232) -->
  <polygon points="
    488,256
    372,457
    140,457
    24,256
    140,55
    372,55
  " fill="url(#g1)"/>

  <!-- Inner regular hexagon (radius 200) -->
  <polygon points="
    456,256
    356,429
    156,429
    56,256
    156,83
    356,83
  " fill="#0f1420"/>

  <!-- Lambda character — centered in hexagon -->
  <text
    x="256"
    y="252"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="290"
    font-weight="400"
    fill="#fff"
    opacity="0.95"
  >&#x03BB;</text>

  <!-- Base accent bar -->
  <rect x="195" y="398" width="122" height="12" rx="2" fill="#dd6b20" opacity="0.5"/>

  <!-- Corner verification brackets -->
  <path d="M 163 128 L 163 103 L 188 103" fill="none" stroke="#dd6b20" stroke-width="5" stroke-linecap="square" opacity="0.55"/>
  <path d="M 349 128 L 349 103 L 324 103" fill="none" stroke="#dd6b20" stroke-width="5" stroke-linecap="square" opacity="0.55"/>

</svg></span>
      <span class="brand-name">World</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <label class="addr">
      <span class="prompt">world&gt;</span>
      <input id="addr" type="text" aria-label="Go to an address" spellcheck="false" autocomplete="off" placeholder="row-189@6 · shared@0ffbb9c · back">
    </label>
    <span class="hmsg" id="hmsg"></span>
    <button type="button" class="hbtn mono" id="keys-btn" aria-label="Keyboard shortcuts" aria-keyshortcuts="?">?</button>
    <button type="button" class="hbtn" id="look-btn" aria-label="Appearance" aria-keyshortcuts=","><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"></path></svg></button>
  </header>
  <main class="stage" id="stage" data-view="timeline">
    <section class="layer" id="L0" aria-label="The world timeline"><div class="canvas" id="tl"></div></section>
    <section class="layer" id="L1" aria-label="One brane"><div class="canvas" id="br"></div></section>
    <div class="pop" id="keys" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
    <div class="pop" id="look" role="dialog" aria-label="Appearance" hidden></div>
    <div class="tip" id="tip" hidden></div>
  </main>
</div>
<script src="/surface/surface.js" defer></script>
<script src="/surface/app.js" defer></script>
</body>
</html>
