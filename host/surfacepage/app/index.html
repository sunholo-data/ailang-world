<!doctype html>
<html lang="en" data-app>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World</title>
<link rel="stylesheet" href="/surface/app.css">
</head>
<body>
<div id="root" tabindex="0" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown + - End Home Enter Escape / ? ,">
  <header class="hdr">
    <a class="brand" id="home" href="/surface" aria-label="World: back to the timeline">
      <span class="logo-tile"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32" role="img" aria-label="AILANG"><title>AILANG</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e73c17"/>
      <stop offset="100%" stop-color="#c08015"/>
    </linearGradient>
  </defs>

  <!-- Outer regular hexagon (flat-top, centered at 256,256, radius 232) -->
  <polygon points="
    488,256
    372,457
    140,457
    24,256
    140,55
    372,55
  " fill="url(#g1)"/>

  <!-- Inner regular hexagon (radius 200) -->
  <polygon points="
    456,256
    356,429
    156,429
    56,256
    156,83
    356,83
  " fill="#0f1420"/>

  <!-- Lambda character — centered in hexagon -->
  <text
    x="256"
    y="252"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="290"
    font-weight="400"
    fill="#fff"
    opacity="0.95"
  >&#x03BB;</text>

  <!-- Base accent bar -->
  <rect x="195" y="398" width="122" height="12" rx="2" fill="#dd6b20" opacity="0.5"/>

  <!-- Corner verification brackets -->
  <path d="M 163 128 L 163 103 L 188 103" fill="none" stroke="#dd6b20" stroke-width="5" stroke-linecap="square" opacity="0.55"/>
  <path d="M 349 128 L 349 103 L 324 103" fill="none" stroke="#dd6b20" stroke-width="5" stroke-linecap="square" opacity="0.55"/>

</svg></span>
      <span class="brand-name">World</span>
    </a>
    <nav class="camera-angles" aria-label="View angle">
      <a href="/surface" id="timeline-angle" aria-current="page">Timeline</a>
      <a href="/surface#heads" id="head-angle">Heads</a>
    </nav>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <label class="addr">
      <span class="prompt">world&gt;</span>
      <input id="addr" type="text" aria-label="Go to an address" spellcheck="false" autocomplete="off" placeholder="row-189@6 · shared@0ffbb9c · back · episode report &lt;episode&gt; · why &lt;target&gt;">
    </label>
    <span class="hmsg" id="hmsg"></span>
    <button type="button" class="hbtn" id="compose-btn" aria-label="New episode" title="New episode" hidden>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.3"/><circle cx="6" cy="19" r="2.3"/><path d="M6 7.5v9M6 15c0-5 9-2 9-8M15 4h6m-3-3v6"/></svg>
      <span>New episode</span>
    </button>
    <button type="button" class="hbtn mono" id="keys-btn" aria-label="Keyboard shortcuts" aria-keyshortcuts="?">?</button>
    <button type="button" class="hbtn" id="look-btn" aria-label="Appearance" aria-keyshortcuts=","><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"></path></svg></button>
  </header>
  <main class="stage" id="stage" data-view="timeline">
    <section class="layer" id="L0" aria-label="The world timeline"><div class="canvas" id="tl"></div></section>
    <section id="head-space" aria-label="Branch heads" hidden inert>
      <div id="head-toolbar" hidden>
        <button type="button" id="head-status-toggle" aria-expanded="false" aria-controls="head-status-detail">
          <strong>Now</strong><span id="head-status-health"></span><span id="head-status-activity"></span><span class="status-chevron" aria-hidden="true"></span>
        </button>
        <div id="head-status-detail" role="region" aria-label="World status" hidden></div>
      </div>
    </section>
    <section class="layer" id="L1" aria-label="One brane"><div class="canvas" id="br"></div></section>
    <div class="pop" id="keys" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
    <div class="pop" id="look" role="dialog" aria-label="Appearance" hidden></div>
    <div class="tip" id="tip" hidden></div>
  </main>
</div>
<dialog id="episode-draft" data-catalog="" aria-labelledby="draft-title">
  <header class="draft-bar"><span>World / Episodes</span><button type="button" id="draft-close">Close</button></header>
  <div class="draft-scroll">
    <h1 id="draft-title" tabindex="-1">New episode</h1>
    <div class="draft-lineage" aria-label="Proposed branch"><span class="draft-base"><i aria-hidden="true"></i><span id="draft-parent"></span></span><span class="draft-fork" aria-hidden="true"></span><span class="draft-child"><i aria-hidden="true"></i>New episode</span></div>
    <form id="draft-form">
      <div class="draft-grid"><section>
        <label for="draft-task">What should the agent accomplish?</label>
        <textarea id="draft-task" required maxlength="8000" rows="5" placeholder="Describe the outcome and how you’ll know it’s ready."></textarea>
        <fieldset><legend>Repository and base</legend><div id="draft-repos"></div></fieldset>
        <fieldset><legend>Authority preset</legend><div id="draft-presets"></div></fieldset>
      </section><section class="draft-boundary">
        <h2>Agent authority</h2><div id="draft-authority"></div>
        <fieldset><legend>Agent host</legend><div id="draft-hosts"></div></fieldset>
        <label for="draft-model">Model override</label><input id="draft-model" maxlength="128" placeholder="Host default">
        <label for="draft-ttl">Session lifetime in minutes</label><input id="draft-ttl" type="number" step="any" min="0.0166666666" required>
      </section></div>
      <button type="submit" class="draft-primary">Review episode</button>
    </form>
    <section id="draft-review" hidden></section>
  </div>
</dialog>
<script src="/surface/surface.js" defer></script>
<script src="/surface/app.js" defer></script>
</body>
</html>
