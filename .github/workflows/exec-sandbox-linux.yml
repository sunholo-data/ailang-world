name: exec-sandbox linux (row 140)

# Row 140 M0 (w-workspace-exec-toolchain-effect §6 AC0.2): measure srt's confinement under
# bubblewrap on ubuntu-latest with the SAME matrix the macOS rig runs. Separate from ci.yml so
# the two merge-gate jobs stay exactly two; it runs only when the matrix, its pin or this file
# change, or by hand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - design_docs/verification/world-row140-m0/**
      - .github/workflows/exec-sandbox-linux.yml
  push:
    branches: [dev]
    paths:
      - design_docs/verification/world-row140-m0/**
      - .github/workflows/exec-sandbox-linux.yml

permissions:
  contents: read

jobs:
  matrix:
    name: srt confinement matrix (bubblewrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bubblewrap, socat, ripgrep; allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the pinned srt and check its cli.js digest
        run: |
          PIN=design_docs/verification/world-row140-m0/pin.json
          V=$(jq -r .version "$PIN"); WANT=$(jq -r .cli_sha256 "$PIN")
          mkdir -p "$RUNNER_TEMP/srt" && cd "$RUNNER_TEMP/srt"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@anthropic-ai/sandbox-runtime@$V"
          GOT=$(sha256sum node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js | cut -d' ' -f1)
          echo "srt $V cli.js sha256 $GOT (pinned $WANT)"
          test "$GOT" = "$WANT"
      - name: Run the matrix
        run: |
          python3 design_docs/verification/world-row140-m0/m0_matrix.py \
            --srt-node-modules "$RUNNER_TEMP/srt/node_modules" \
            --node "$(command -v node)" \
            --json "$RUNNER_TEMP/m0-linux.json"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-linux
          path: ${{ runner.temp }}/m0-linux.json
