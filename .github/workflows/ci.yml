name: CI

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  ailang-verify:
    name: ailang-code verify gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install released ailang binary
        run: |
          set -euo pipefail
          base="https://github.com/sunholo-data/ailang/releases/latest/download"
          curl -fsSL -o linux.x64.ailang.tar.gz "$base/linux.x64.ailang.tar.gz"
          curl -fsSL -o linux.x64.ailang.tar.gz.sha256 "$base/linux.x64.ailang.tar.gz.sha256"
          sha256sum -c linux.x64.ailang.tar.gz.sha256
          mkdir -p "$HOME/.local/bin"
          tar -xzf linux.x64.ailang.tar.gz -C "$HOME/.local/bin" ailang
          chmod +x "$HOME/.local/bin/ailang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Z3 4.16.0 (ai-check's SMT solver — matches the doc's pinned Z3)
        run: |
          set -euo pipefail
          # The released ailang binary shells out to `z3` (searches PATH +
          # /usr/bin, /usr/local/bin, /snap/bin). ubuntu-latest ships none, so
          # every contract silently SKIPS (vanishes from verify.results[]) and
          # the required-check manifest gate is meaningless without it.
          Z3_VER=4.16.0
          Z3_DIR="z3-${Z3_VER}-x64-glibc-2.39"
          Z3_SHA=7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e
          curl -fsSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VER}/${Z3_DIR}.zip"
          echo "${Z3_SHA}  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          sudo install -m 0755 "${Z3_DIR}/bin/z3" /usr/local/bin/z3
          z3 --version

      - name: ailang version
        run: ailang --version

      - name: Verify all .ail modules (ai-check = check + Z3 verify)
        run: ./scripts/verify_ail.sh

  go-verify:
    name: go host build + test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go version
        run: go version

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1
