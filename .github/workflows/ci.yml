name: CI

on:
  push:
    branches: [dev]
  pull_request:

# The z3 pin is declared ONCE, at workflow scope, because BOTH jobs must install the SAME solver.
# Job 1 runs `ai-check` directly; job 2 runs it THROUGH host/verifygate's shim arms, which drive
# scripts/verify_ail.sh end to end. Two job-local literals would let the lanes drift silently —
# the same "two lanes resolve different things" defect 9/CF-A-2 was. Ratified: 9/OD-11.
env:
  Z3_VER: 4.16.0
  Z3_SHA: 7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e

jobs:
  ailang-verify:
    name: ailang-code verify gate
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Install released ailang binary
        run: |
          set -euo pipefail
          base="https://github.com/sunholo-data/ailang/releases/latest/download"
          curl -fsSL -o linux.x64.ailang.tar.gz "$base/linux.x64.ailang.tar.gz"
          curl -fsSL -o linux.x64.ailang.tar.gz.sha256 "$base/linux.x64.ailang.tar.gz.sha256"
          sha256sum -c linux.x64.ailang.tar.gz.sha256
          mkdir -p "$HOME/.local/bin"
          tar -xzf linux.x64.ailang.tar.gz -C "$HOME/.local/bin" ailang
          chmod +x "$HOME/.local/bin/ailang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Z3 ${{ env.Z3_VER }} (ai-check's SMT solver — the workflow-level pin)
        run: |
          set -euo pipefail
          # The released ailang binary shells out to `z3` (searches PATH +
          # /usr/bin, /usr/local/bin, /snap/bin). ubuntu-latest ships none, so
          # every contract silently SKIPS (vanishes from verify.results[]) and
          # the required-check manifest gate is meaningless without it.
          Z3_DIR="z3-${Z3_VER}-x64-glibc-2.39"
          curl -fsSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VER}/${Z3_DIR}.zip"
          echo "${Z3_SHA}  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          sudo install -m 0755 "${Z3_DIR}/bin/z3" /usr/local/bin/z3
          z3 --version

      - name: ailang version
        run: ailang --version

      # The step above installs `releases/latest`, which moved to v0.33.0 on 2026-08-04 — so the
      # two existing legs verify against an UNPINNED compiler. That gap is queue item 9's and is
      # human-gated, so it is deliberately left alone here. The world-package leg, however, is a
      # byte-exact gate: it recomputes package hashes and cross-checks them against the CLI's own,
      # so it must have the PINNED compiler or it is comparing two different algorithms. v0.33.0
      # also fails that gate's own package-test step (measured on the rig: "5 properties never
      # ran (no generator)"). This installs the pin to a SEPARATE path and hands it to that leg
      # alone via WORLD_PKG_AILANG_BIN, leaving PATH `ailang` — and thus legs 1-2 — untouched.
      - name: Install PINNED v0.30.0 ailang for the world-package leg only
        run: |
          set -euo pipefail
          base="https://github.com/sunholo-data/ailang/releases/download/v0.30.0"
          curl -fsSL -o pinned.tar.gz "$base/linux.x64.ailang.tar.gz"
          curl -fsSL -o pinned.tar.gz.sha256 "$base/linux.x64.ailang.tar.gz.sha256"
          # the published checksum names the release asset, not our local filename
          echo "$(cut -d' ' -f1 pinned.tar.gz.sha256)  pinned.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.pinned-ailang"
          tar -xzf pinned.tar.gz -C "$HOME/.pinned-ailang" ailang
          chmod +x "$HOME/.pinned-ailang/ailang"
          # NO PIPE. `cmd --version | grep -q` under `set -o pipefail` is a RACE:
          # `grep -q` exits on its first match while `--version` still has 6 of its
          # 7 lines to write, so the writer takes SIGPIPE and the pipeline reports
          # 141. Measured on the rig: the piped form failed 3/40 runs, the form
          # below 0/200. It took dev red on a6cc473 — a DOCS-ONLY commit — while
          # passing on e24a6f0, 1856bfb and both PR runs, which is exactly what an
          # intermittent race looks like from the outside: a red with no cause in
          # the diff. Capturing first is not sufficient on its own; `echo "$big" |
          # grep -q` reproduces 141 too. The fix is to use no pipe at all.
          pinned_ver="$("$HOME/.pinned-ailang/ailang" --version)"
          echo "$pinned_ver"
          case "$pinned_ver" in
            *'AILANG v0.30.0'*) ;;
            *) echo "✗ pinned world-package binary is not v0.30.0" >&2; exit 1 ;;
          esac
          echo "WORLD_PKG_AILANG_BIN=$HOME/.pinned-ailang/ailang" >> "$GITHUB_ENV"

      - name: Verify all .ail modules (ai-check = check + Z3 verify)
        run: ./scripts/verify_ail.sh

  go-verify:
    name: go host build + test gate
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: go version
        run: |
          go version
          go env GOVERSION

      - name: Install PINNED v0.30.0 ailang binary (replay goldens are v0.30.0-scoped)
        run: |
          set -euo pipefail
          # The replay tests drive the released ailang as a subprocess and
          # byte-compare its output against goldens generated with v0.30.0
          # (testdata/recorded_result.bytes, recorded_world_hash.txt). Pin the
          # TAG, not `latest`: any drift would break the byte-for-byte replay.
          # Without AILANG_BIN, pinnedBinary(t) t.Skip()s and CI is false-green.
          base="https://github.com/sunholo-data/ailang/releases/download/v0.30.0"
          curl -fsSL -o linux.x64.ailang.tar.gz "$base/linux.x64.ailang.tar.gz"
          curl -fsSL -o linux.x64.ailang.tar.gz.sha256 "$base/linux.x64.ailang.tar.gz.sha256"
          sha256sum -c linux.x64.ailang.tar.gz.sha256
          mkdir -p "$HOME/.local/bin"
          tar -xzf linux.x64.ailang.tar.gz -C "$HOME/.local/bin" ailang
          chmod +x "$HOME/.local/bin/ailang"
          # Assert the pinned version loudly so a tag drift is a red step here,
          # not a silent goldens mismatch downstream.
          # Same no-pipe form as the world-package install above. This site has
          # never gone red, but only by ACCIDENT OF SIZE: `--version` is 167 bytes,
          # which fits the 64 KiB pipe buffer, so `echo` never blocks and never
          # takes SIGPIPE. That is a property of the output length, not of the
          # shape — the shape is the same race, one verbose release away.
          ver="$("$HOME/.local/bin/ailang" --version)"
          echo "$ver"
          case "$ver" in
            *'v0.30.0'*) ;;
            *) echo "✗ AILANG_BIN is not v0.30.0" >&2; exit 1 ;;
          esac
          echo "AILANG_BIN=$HOME/.local/bin/ailang" >> "$GITHUB_ENV"

      - name: Install Z3 ${{ env.Z3_VER }} (host/verifygate drives the REAL .ail gate under go test)
        run: |
          set -euo pipefail
          # 9/OD-11, RATIFIED: "Yes you can install z3 on cicd".
          # host/verifygate's shim arms run scripts/verify_ail.sh end to end. Without a solver
          # `ai-check` reports verify.available=false and every contract vanishes from
          # verify.results[] (V20/V27), so the gate reds at leg 1 and the accept-arms could only
          # assert markers emitted BEFORE Z3 matters — they were green in a lane where the gate
          # they drive was red. Same version and sha as job 1, from the workflow-level pin above.
          Z3_DIR="z3-${Z3_VER}-x64-glibc-2.39"
          curl -fsSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VER}/${Z3_DIR}.zip"
          echo "${Z3_SHA}  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          sudo install -m 0755 "${Z3_DIR}/bin/z3" /usr/local/bin/z3
          z3 --version

      - name: go build + test gate (replay tests run against pinned AILANG_BIN)
        # Expiry is RED; route an overrun to 4e/OD-4, never silently raise this ceiling.
        timeout-minutes: 25
        run: ./scripts/verify_go.sh

      # run.sh exits 1 when no affected toolchain reproduces, which is the good
      # "linux/amd64 is clean" outcome; this records evidence and is not a gate.
      - name: Measure compiler reproducer on linux/amd64 (non-gating)
        continue-on-error: true
        timeout-minutes: 15
        run: ./design_docs/verification/w-race-gate-blindspot/run.sh

      - name: worldd benchmark smoke gate
        run: ./scripts/bench_worldd.sh --smoke

      - name: worldd bench claim-structure gate
        timeout-minutes: 2
        run: ./scripts/bench_worldd.sh --check-claims

      - name: worldd bench recorder refuses off-rig
        timeout-minutes: 2
        run: |
          set -euo pipefail
          err="$(mktemp)"
          if ./scripts/bench_worldd.sh --record-pair --variant . --control . 2>"$err"; then
            printf '%s\n' 'recorder unexpectedly succeeded on the off-rig runner' >&2
            exit 1
          fi
          if grep -Fq 'probe FAILED: sysctl -n hw.ncpu' "$err"; then
            :
          else
            printf '%s\n' 'recorder did not refuse at the expected hw.ncpu probe' >&2
            sed -n '1,80p' "$err" >&2
            exit 1
          fi
