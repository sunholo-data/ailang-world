<div id="root" tabindex="0" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown + - End Home Enter Escape / ? ,">

      <span class="brand-name">World</span>

    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>

      <span class="prompt">world&gt;</span>
